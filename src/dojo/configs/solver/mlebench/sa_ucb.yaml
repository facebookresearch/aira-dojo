defaults:
  - sa_ucb
  - /solver/operators@operators:
    - mlebench/aira_operators/debug         # Enables debugging mode for operator prompts
    - mlebench/aira_operators/draft         # Enables draft mode for generating initial outputs
    - mlebench/aira_operators/improve       # Enables improvement mode for refining outputs
    - mlebench/aide_operators/analyze       # Enables evaluation mode for assessing outputs
    - mlebench/aira_operators/promise_scorer # Enables promise scoring for semantic awareness
    - mlebench/aira_operators/novelty_scorer # Enables novelty scoring for diversity
  - override memory: simple_memory  # Enables Memory operator
  - override memory@debug_memory: debug_memory # Enables Debug Memory operator

# Specifies the Semantic Aware UCB (SA-UCB) algorithm as the action selector
_target_: dojo.config_dataclasses.solver.sa_ucb.SA_UCBSolverConfig

# Whether to export search results after execution
export_search_results: true

# --- Search Configuration ---
step_limit: 2500
num_children: 5
uct_c: 0.25
max_debug_depth: 20
data_preview: True
max_debug_time: 1e9 # disabled

# --- Semantic Scoring Configuration ---
# Initial hyperparameters for semantic bonuses
# These control how much the promise and novelty scores influence node selection
lambda_promise: 0.3  # Weight for promise score (how good the approach seems)
gamma_novelty: 0.2   # Weight for novelty score (how diverse/different it is)

use_test_score: False
use_complexity: False

operators:
  draft:
    llm:
      generation_kwargs:
        temperature: 0.6
        top_p: 0.95
  improve:
    llm:
      generation_kwargs:
        temperature: 0.6
        top_p: 0.95
  debug:
    llm:
      generation_kwargs:
        temperature: 0.6
        top_p: 0.95
  analyze:
    llm:
      generation_kwargs:
        temperature: 0.5
  promise_scorer:
    llm:
      generation_kwargs:
        temperature: 0.3  # Lower temperature for consistent scoring
  novelty_scorer:
    llm:
      generation_kwargs:
        temperature: 0.3  # Lower temperature for consistent scoring
